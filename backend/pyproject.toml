[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-backend"
version = "1.0.0"
description = "PhishGuard Backend — Hybrid Browser-Based Phishing Detection API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.2",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "numpy>=2.1.2",
    "joblib>=1.4.2"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    ".",
    "app"
]

[tool.ruff]
line-length = 100
target-version = "py311"
